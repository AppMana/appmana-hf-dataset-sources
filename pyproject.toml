[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appmana-hf-git-datasets"
version = "0.2.0"
description = "Resolve Hugging Face dataset ids to Git remotes or arbitrary URLs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.urls]
Homepage = "https://github.com/AppMana/appmana-hf-dataset-sources"
Repository = "https://github.com/AppMana/appmana-hf-dataset-sources"
Issues = "https://github.com/AppMana/appmana-hf-dataset-sources/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/appmana_hf_git_datasets"]

[tool.hatch.build.targets.wheel.force-include]
"src/appmana_hf_git_datasets_activate.pth" = "appmana_hf_git_datasets_activate.pth"
